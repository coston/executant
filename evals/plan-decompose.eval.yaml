name: plan-decompose
prompt: src/prompts/plan-decompose.txt
placeholders:
  - DESCRIPTION
  - RESEARCH_DOC

test_cases:
  - id: simple-feature
    vars:
      DESCRIPTION: "add rate limiting to all API endpoints"
      RESEARCH_DOC: fixtures/research-doc-simple.md
    criteria:
      - "Output is valid JSON with a 'goal' field and a 'steps' array"
      - "No hardcoded file paths in any prompt or command field — all paths use {{var_name}} substitution"
      - "Includes at least one script step whose command runs tests (npm test or similar)"
      - "Includes at least one script step whose command runs lint or build"
      - "vars block is present and appears before the steps block in the JSON"
      - "Steps are atomic — no single step description includes 'and' connecting two distinct actions"

  - id: repeat-pattern
    vars:
      DESCRIPTION: "run the codebase audit 10 times to surface flaky quality issues"
      RESEARCH_DOC: fixtures/research-doc-repeat.md
    criteria:
      - "Output is valid JSON"
      - "Uses repeat: 10 (not forEach with a numeric array like ['1','2',...,'10'])"
      - "Does not expand into 10 separate named steps"

  - id: complex-multi-package
    vars:
      DESCRIPTION: "add user profile pages with photo upload support"
      RESEARCH_DOC: fixtures/research-doc-complex.md
    criteria:
      - "Output is valid JSON with a 'goal' field and a 'steps' array"
      - "No hardcoded file paths in any prompt field — all file references use {{var_name}} substitution (workspace flags and package names in script command fields are acceptable)"
      - "Includes verification script steps matching commands from the research doc"
      - "vars block is present and all file paths in steps use {{var_name}} syntax"
      - "Step count is 6 or more — complex task should not be collapsed into too few steps"

  - id: nested-steps-foreach
    vars:
      DESCRIPTION: "add a shared logger utility to all packages and verify each one passes lint, tests, and build"
      RESEARCH_DOC: fixtures/research-doc-monorepo.md
    criteria:
      - "Output is valid JSON with a 'goal' field and a 'steps' array"
      - "Contains a forEach step with a nested 'steps' array (not a single command or prompt field) for per-package verification"
      - "The nested steps array contains at least two child steps covering lint, test, or build per package"
      - "The forEach items are the workspace package paths (packages/shared, packages/api, packages/web or similar)"
      - "Each child step in the nested steps array uses {{item}} in its name or command field"
      - "No hardcoded file paths in any prompt field — all file references use {{var_name}} substitution"
      - "vars block is present and appears before the steps block"

  - id: user-specified-steps
    vars:
      DESCRIPTION: |
        Build a new blog platform using NextJS, Prisma, and Resend.
        1. Set up the NextJS project with TypeScript and configure Prisma with a PostgreSQL schema (Post, Author, Tag models).
        2. Create the GitHub repo, push the initial commit, and set up CI with GitHub Actions (lint, typecheck, test on push).
        3. Develop the core blog features: post listing page, individual post page with MDX rendering, author profile page, and tag filtering.
        4. Final polish: add Resend email subscription flow, dark mode toggle, SEO metadata, and deploy to Vercel.
      RESEARCH_DOC: fixtures/research-doc-user-steps.md
    criteria:
      - "Output is valid JSON with a 'goal' field and a 'steps' array"
      - "The steps array contains exactly 4 non-verification main steps (prompt steps, one per user-specified step)"
      - "Step 1 (or its name/prompt) covers NextJS project setup and Prisma schema configuration"
      - "Step 2 (or its name/prompt) covers GitHub repo creation and CI/GitHub Actions setup"
      - "Step 3 (or its name/prompt) covers core blog feature development including post listing, post page, author profile, and tag filtering"
      - "Step 4 (or its name/prompt) covers Resend email subscription, dark mode, SEO metadata, and Vercel deployment"
      - "No hardcoded file paths in prompt fields — all paths use {{var_name}} substitution"
      - "vars block is present and appears before the steps block"
      - "Includes at least one type:script step running npm run lint, npm test, or npm run build appended after the 4 main steps"
