name: retrospective-analysis
prompt: src/prompts/retrospective-analysis.txt
placeholders:
  - TASK_NAME
  - ORIGINAL_GOAL
  - ORIGINAL_YAML
  - HIGHLIGHTS
  - METRICS

test_cases:
  - id: judge-failure
    vars:
      TASK_NAME: "convert-legacy-api"
      ORIGINAL_GOAL: fixtures/goal-convert-legacy-api.txt
      ORIGINAL_YAML: fixtures/retrospective-judge-fail-original.yaml
      HIGHLIGHTS: fixtures/retrospective-judge-fail-highlights.txt
      METRICS: "Judge failures: 1 | Self-healing activations: 0 | Complex sequences: 1"
    criteria:
      - "Output is valid JSON with 'improved_yaml' and 'changelog' fields"
      - "The improved_yaml preserves the original goal exactly: 'Convert the legacy REST API endpoints to use async/await and add error handling'"
      - "The improved_yaml keeps self_improve: true"
      - "The validate-conversion step in improved_yaml has more specific instructions than 'Validate the conversion results' — numbered sub-steps or explicit success criteria"
      - "The changelog mentions the judge failure or the vague validate-conversion step as the problem that was fixed"

  - id: self-healing-activation
    vars:
      TASK_NAME: "add-e2e-tests"
      ORIGINAL_GOAL: "Add end-to-end tests for the checkout flow using Playwright"
      ORIGINAL_YAML: fixtures/retrospective-self-heal-original.yaml
      HIGHLIGHTS: fixtures/retrospective-self-heal-highlights.txt
      METRICS: "Judge failures: 0 | Self-healing activations: 1 | Complex sequences: 0"
    criteria:
      - "Output is valid JSON with 'improved_yaml' and 'changelog' fields"
      - "The improved_yaml preserves the original goal exactly: 'Add end-to-end tests for the checkout flow using Playwright'"
      - "The improved_yaml adds a step before run-tests that installs Playwright browsers (contains 'playwright install' or similar)"
      - "The changelog mentions the self-healing activation or the missing Playwright browsers as the issue that prompted the change"

  - id: goal-preservation
    vars:
      TASK_NAME: "migrate-database-schema"
      ORIGINAL_GOAL: "Migrate the users table to add a profile_image column with a default value"
      ORIGINAL_YAML: fixtures/retrospective-multi-issue-original.yaml
      HIGHLIGHTS: fixtures/retrospective-multi-issue-highlights.txt
      METRICS: "Judge failures: 1 | Self-healing activations: 1 | Complex sequences: 0"
    criteria:
      - "Output is valid JSON with 'improved_yaml' and 'changelog' fields"
      - "The improved_yaml contains the exact text: 'Migrate the users table to add a profile_image column with a default value'"
      - "The improved_yaml keeps self_improve: true"
      - "The changelog contains both a 'Problems Identified' section and a 'Changes Applied' section"
