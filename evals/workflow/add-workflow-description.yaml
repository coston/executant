# Workflow eval task — small scope (~3 files, clear test criteria)
# eval_criteria is read by the eval harness; ignored by executant when run standalone.
eval_criteria:
  - "src/types.ts Workflow interface has an optional 'description' field of type string"
  - "src/load-workflow.ts RawWorkflowSchema validates an optional 'description' field"
  - "src/load-workflow.ts passes 'description' through to the returned Workflow object"
  - "src/runner.ts emits a log event containing the description text before the first step"
  - "At least one test covers loading a workflow with a description field"
  - "At least one test verifies the log event is emitted when description is present"

goal: "Add an optional description field to workflow YAML that is logged at workflow start"

vars:
  research_doc: .eval/research.md
  plan_doc: .eval/plan.md

steps:
  - name: explore
    prompt: |
      Research the executant codebase to understand how to add a new optional top-level
      field to workflow YAML. Your task: add an optional `description` field to workflows.

      Explore these specific files and note exact line numbers:
      1. src/types.ts — find the Workflow interface and RawWorkflow/RawStep types
      2. src/load-workflow.ts — find RawWorkflowSchema (Zod schema), loadWorkflow return
      3. src/runner.ts — find where runWorkflow emits the workflow:start event and early
         log events
      4. src/tests/load-workflow.test.ts — understand the test patterns (tmpYaml helper)
      5. src/tests/runner.test.ts or similar — understand how runner events are tested

      Also run: grep -rn "goal\|workflow:start\|WorkflowStartEvent" src/ --include="*.ts"
      to understand how the existing `goal` field flows through the system.

      Write your complete findings to {{research_doc}} including:
      - Exact file paths and line numbers for every change needed
      - The current Workflow interface definition
      - How loadWorkflow currently builds and returns the Workflow object
      - Where in runner.ts to emit the description log event
      - The test helper pattern (tmpYaml) with a short example

  - name: plan
    context: [research_doc]
    prompt: |
      Based on the research above, write a precise implementation plan for adding an
      optional `description` field to workflow YAML.

      When present, description should be emitted as a log:info event at the very
      start of workflow execution (before any steps run).

      Write to {{plan_doc}} with these sections:
      1. Files to change (path, what to add/change, exact location)
      2. Tests to add (file, test name, what to assert)
      3. No code yet — plan only

  - name: implement
    context: [research_doc, plan_doc]
    prompt: |
      Implement the plan above. Add an optional `description` field to workflow YAML.

      Requirements:
      - Add `description?: string` to the Workflow interface in src/types.ts
      - Add `description: z.string().optional()` to RawWorkflowSchema in src/load-workflow.ts
      - Include `description: doc.description` in the loadWorkflow return object
      - In src/runner.ts, after yielding the workflow:start event, if workflow.description
        exists, yield a log event: { type: "log", level: "info", text: workflow.description }
      - Add tests: one for loading with description, one for loading without, one verifying
        the log event is emitted (collect events from runWorkflow in a minimal test workflow)

      Keep changes minimal — follow existing code patterns exactly.

  - name: test
    type: script
    command: npm test
    self_healing: true

  - name: commit
    type: script
    command: |
      git add -A
      git commit -m "feat: add optional description field to workflow YAML"
    continue_on_error: true
